name: Build Cyrene plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: tools/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cyrene-pilot-linux-amd64
          path: dist/
          if-no-files-found: error
